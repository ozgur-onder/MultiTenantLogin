<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama - İş Zekası Platformu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M3 3h2v18H3V3zm6 8h2v10H9V11zm6-5h2v15h-2V6zm6 4h2v11h-2v-11z'/></svg>">
    <link rel="stylesheet" href="/temalar/ortak/bildirim.css">
    <link id="theme-style" rel="stylesheet" href="/temalar/sifremi_unuttum/beyaz.css">
</head>
<body>

    <div class="split-layout">
        
        <div class="brand-panel">
            <div class="brand-content">
                <h1>İş Zekası Platformu</h1>
                <p>Yerli ve milli iş zekası çözümü.</p>
            </div>
        </div>

        <div class="form-panel">
            
            <div class="top-controls">
                <button class="theme-toggle" title="Temayı Değiştir">
                </button>
            </div>

            <div class="form-wrapper">
                <h2>Şifrenizi mi Unuttunuz?</h2>
                <p class="subtitle">Sıfırlama bağlantısı için bilgilerinizi girin.</p>

                <div class="input-group">
                    <label for="sicil-no">Sicil Numarası</label>
                    <div class="input-wrapper">
                        <input type="text" id="sicil-no" autocomplete="off" placeholder="Lütfen Sicil Numaranızı Giriniz">
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-posta Adresi</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" autocomplete="off" placeholder="Lütfen E-posta Adresinizi Giriniz">
                    </div>
                </div>
                
                <button class="login-btn" id="sifirlaBtn">Sıfırlama Bağlantısı Gönder</button>
                <div class="forgot-password">
                    <a href="/" class="forgot-password-link">← Giriş ekranına dön</a>
                </div>
            </div>

            <div class="panel-footer">
                &copy; 2026 İş Zekası Platformu. Tüm hakları saklıdır.
            </div>

        </div>
    </div>

    <script src="/dosyalar/betikler/ortak/bildirim.js"></script>
    <script src="/dosyalar/betikler/sifremi_unuttum/tema.js"></script>
    <script src="/dosyalar/betikler/sifremi_unuttum/sifirlama_islem.js"></script>

</body>
</html>
